<!doctype html> <!-- Declares this document as HTML5 so browsers render it in standards mode -->

<html lang="en"> <!-- Root element of the page; lang="en" tells browsers and screen readers the language -->

<head> <!-- Metadata container: information ABOUT the page, not content shown on the page -->
    <meta charset="utf-8" /> <!-- Character encoding for readable text -->
    <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- Enables responsive layout -->

    <title>Inspirations: The Final Stretch</title> <!-- Page title shown in browser tab and search results -->

    <link rel="stylesheet" href="/css/styles.css" /> <!-- Global stylesheet for site-wide styling -->
    <style>
        .hero-image {
            background-image: url("/assets/westvillage.png");

        }
    </style>

    <script src="/js/includes.js" defer></script> <!-- Deferred JS for future header/footer injection -->
</head>

<body>

    <header id="site-header"></header>

    <main class="container"> <!-- Semantic role: main content unique to this page -->

        <div class="hero-image">
            <h1 class="hero">Contact</h1>
        </div>
        <h1>Send me a message</h1>
        <form action="https://formspree.io/f/xzdolekb" method="POST" id="contact-form">
            <fieldset>
                <legend> Contact Form:</legend>
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required placeholder="First Name">

                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required placeholder="Last Name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="email@sample.com"
                    pattern="[^@\s]+@[^@\s]+\.[^@\s]+">

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="123-456-7890"
                    pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="8" cols="40"
                    placeholder="Type your message here."></textarea>

                <p>Subject(s) you'd like to discuss with me:</p>
                <label class="checkbox-container">Art
                    <input type="checkbox" checked="checked">
                    <span class="checkmark"></span>
                </label>

                <label class="checkbox-container">Sports
                    <input type="checkbox">
                    <span class="checkmark"></span>
                </label>

                <label class="checkbox-container">Music
                    <input type="checkbox">
                    <span class="checkmark"></span>
                </label>

                <label class="checkbox-container">My work
                    <input type="checkbox">
                    <span class="checkmark"></span>
                </label>

                <p>Preferred form of contact:</p>
                <label class="radiobutton-container">Phone Call
                    <input type="radio" name="choice" value="option1">
                    <span class="checkmark"></span>
                </label>

                <label class="radiobutton-container">Email
                    <input type="radio" name="choice" value="option2">
                    <span class="checkmark"></span>
                </label>

                <label class="radiobutton-container">Text
                    <input type="radio" name="choice" value="option3">
                    <span class="checkmark"></span>
                </label>

                <p>How did you hear about this site?</p>
                <label class="sitediscovery-container">
                    <select id="sitediscovery" name="sitediscovery">
                        <option value="school">School</option>
                        <option value="work">Work</option>
                        <option value="word-of-mouth">Word of mouth</option>
                    </select>
                </label>

                <button type="submit">Submit</button>
            </fieldset>
        </form>

    </main>

    <!-- SITE FOOTER Role: Contains secondary information (copyright, secondary links). Will also be extracted into an include later. -->
    <!-- Footer ID will be left on the page so JvaScript will knwo where to drop in the footer.html file -->

    <footer id="site-footer" class="site-footer"></footer>

</body>

</html>
